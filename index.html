<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developer Workshop Registration</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="form-container">
        <h1>Developer Workshop Registration</h1>

        <form id = "registration-form">

            <div class="form-group">
                <label for="fullname">FullName:</label>
                <input type="text" id="fullname" name="fullname" required placeholder="Enter your full name">
            </div>

            <div class="form-group">
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" required placeholder="Enter your email address">
            </div>

            <div class="form-group">
                <label for="experience">Experience Level:</label>
                <select id="experience" name="experience" required>
                    <option value="" disabled selected>Select your experience level</option>
                    <option value="beginner">Beginner</option>
                    <option value="intermediate">Intermediate</option>
                    <option value="advanced">Advanced</option>
                </select>
            </div>

            <div class="form-group">
                <label>Workshop Track</label>
                <div class="radio-group">
                    <label><input type="radio" name="track" value="frontend" required> Frontend Web</label>
                    <label><input type="radio" name="track" value="backend"> Backend APIs</label>
                    <label><input type="radio" name="track" value="ui/ux"> UI/UX Design</label>
                </div>
            </div>

            <div class="form-group checkbox-group">
                <label>
                    <input type="checkbox" name="notifications" required> I agree to receive event updates
                </label>
            </div>

            <button type="submit"> Register Now</button>

        </form>
    </div>  
    
</body>
</html>
